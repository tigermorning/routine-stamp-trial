<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도장판">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233fb8a5'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>도장판 체험판</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 언어 선택 → 오늘 칸(큰 도장) → 쌓인 것 → 이번 주 점 → 내 칸 바꾸기(접힘) → 의견 보내기. 폰 한 열 기준 */
:root{
  --bg:#f2f7f5; --card:#ffffff; --ink:#34484a; --soft:#69807f; --line:#dbe7e4;
  --accent:#3fb8a5; --accent-ink:#0b3a33; --sun-bg:#ffe08a; --sun-ink:#6b4f00; --shadow:0 6px 18px rgba(63,140,130,.14);
  --blob1:rgba(63,184,165,.16); --blob2:rgba(255,214,102,.28);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[lang="en"]{--body:"Gowun Dodum",system-ui,"Segoe UI",sans-serif}
:root[lang="zh-Hans"]{--display:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;--body:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
:root[lang="zh-Hant"]{--display:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;--body:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
:root[lang^="yue"]{--display:"PingFang HK","Microsoft JhengHei","Noto Sans HK","Noto Sans TC",sans-serif;--body:"PingFang HK","Microsoft JhengHei","Noto Sans HK","Noto Sans TC",sans-serif}
:root[lang="vi"]{--display:system-ui,"Segoe UI",sans-serif;--body:system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f2b2c; --card:#2a3a3b; --ink:#e6f0ee; --soft:#a3b8b4; --line:#3d5351; --accent:#5fd1be; --accent-ink:#06302a;
    --sun-bg:#8a6d1f; --sun-ink:#fff3c9; --shadow:0 6px 18px rgba(0,0,0,.35); --blob1:rgba(95,209,190,.12); --blob2:rgba(255,214,102,.08); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f2b2c; --card:#2a3a3b; --ink:#e6f0ee; --soft:#a3b8b4; --line:#3d5351; --accent:#5fd1be; --accent-ink:#06302a;
  --sun-bg:#8a6d1f; --sun-ink:#fff3c9; --shadow:0 6px 18px rgba(0,0,0,.35); --blob1:rgba(95,209,190,.12); --blob2:rgba(255,214,102,.08); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 10% 8%,var(--blob1) 0 90px,transparent 91px),radial-gradient(circle at 92% 16%,var(--blob2) 0 70px,transparent 71px);background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto}
button{font-family:inherit;color:var(--ink)}
h1{font-family:var(--display);font-weight:400;font-size:27px;margin:6px 0 2px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:30px;height:30px;flex:none}
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
:root[lang="zh-Hans"] h1,:root[lang="zh-Hans"] h2,:root[lang="zh-Hans"] .nums b,:root[lang="zh-Hant"] h1,:root[lang="zh-Hant"] h2,:root[lang="zh-Hant"] .nums b,:root[lang^="yue"] h1,:root[lang^="yue"] h2,:root[lang^="yue"] .nums b,:root[lang="vi"] h1,:root[lang="vi"] h2,:root[lang="vi"] .nums b{font-weight:700}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.langmenu{position:relative;display:flex;justify-content:flex-end}
.introcard{border-color:var(--accent)}
.introcard p{margin:8px 0 0}
.langbtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.langbtn[aria-expanded="true"]{border-color:var(--accent)}
.langbtn .caret{font-size:11px;opacity:.7}
.langlist{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:180px;max-height:min(60vh,380px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.langlist[hidden]{display:none}
.langlist button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:none;background:none;padding:9px 12px;border-radius:10px;font-size:15px;cursor:pointer}
.langlist button:hover{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.langlist button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.langlist button[aria-selected="true"]::after{content:"✓";font-size:13px}
.langbtn:focus-visible,.langlist button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{text-align:center;color:var(--soft);margin:0 0 14px;font-size:15px;text-wrap:balance}
.notice{background:var(--sun-bg);color:var(--sun-ink);border-radius:14px;padding:8px 12px;font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:2px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--sun-bg);color:var(--sun-ink);border-radius:999px;padding:3px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--line);border-radius:999px;margin:12px 0 14px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb58a,#ffd666,#9be3c8,#7fc8f0,#b3a9f5);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.big{border:3px dashed var(--line);border-radius:22px;background:transparent;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;min-width:0}
.big:active{transform:scale(.96)}
.big:focus-visible,.btn:focus-visible,.dot:focus-visible,.pk:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big .nm{text-align:center;font-size:16px;overflow-wrap:anywhere}
.big .st{font-size:12px;color:var(--soft);min-height:16px;text-align:center}
.box{width:72px;height:72px;display:grid;place-items:center}
.big.done{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.big.mini{border-style:solid;border-color:var(--c)}
.stamp{display:grid;place-items:center;border-radius:50%;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));width:100%;height:100%;font-size:30px;line-height:1;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 6px var(--c);transform:rotate(var(--r,0deg))}
.stamp.mini{opacity:.5}
.ico{width:1.25em;height:1.25em;vertical-align:-.25em}
.stamp .ico{width:70%;height:70%;vertical-align:baseline}
.empty{width:100%;height:100%;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--line);font-size:26px}
.pop .stamp{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:rotate(var(--r,0deg)) scale(2.4);opacity:0}60%{transform:rotate(var(--r,0deg)) scale(.85);opacity:1}100%{transform:rotate(var(--r,0deg)) scale(1)}}
.banner{display:none;margin-top:14px;text-align:center;padding:12px;border-radius:20px;font-size:17px;text-wrap:balance;background:linear-gradient(120deg,#ffe3d1,#fff1bd,#d6f3e8,#d4e9ff,#e3dcfb);background-size:300% 300%;animation:flow 6s ease infinite;color:#34484a}
.banner.show{display:block}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;min-width:0}
.day.today{background:var(--sun-bg);color:var(--sun-ink)}
.day small{font-size:12px;color:inherit;opacity:.8}
.day b{font-weight:400;font-size:15px}
.dots{display:flex;flex-direction:column;gap:5px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;cursor:pointer}
.dot.v1{background:var(--c)}
.dot.v2{background:color-mix(in srgb,var(--c) 40%,transparent)}
.dot[disabled]{opacity:.3;cursor:default}
.mark{font-size:15px;min-height:20px}
.stat{color:var(--soft);font-size:14px;margin:10px 0 0}
.btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot{display:flex;gap:8px;align-items:center;margin-top:10px}
.iconbtn{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--c);background:var(--card);padding:6px;cursor:pointer}
.iconbtn .ico{width:100%;height:100%;display:block}
.slot input{flex:1 1 auto;min-width:0;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}
.x{border:none;background:var(--line);border-radius:999px;min-width:28px;height:28px;cursor:pointer;font-size:13px;padding:0 8px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;max-height:210px;overflow-y:auto;padding:8px 4px}
.picker:empty{display:none}
.pk{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:4px;cursor:pointer;min-width:0}
.pk.on{border-color:var(--accent)}
.pk svg{width:100%;height:auto;display:block}
textarea{width:100%;min-height:96px;font:inherit;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:10px 14px;margin-top:10px;resize:vertical}
.msg{font-size:14px;color:var(--soft);margin:8px 0 0;min-height:20px}
.hintcard p{margin:0 0 10px}
:root[lang="ko"] :is(.stat,.unlockhd,.msg,.hintcard p,.introcard p,.introcard h2,.big .st,.sub,.notice){word-break:keep-all}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.nums div{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:18px;padding:10px 6px;text-align:center}
.nums b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--soft)}
.unlockhd{margin:14px 0 6px;font-size:15px}
.ub{margin:10px 0 8px}
.fall{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:99;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.pop .stamp,.banner{animation:none}.fall{display:none}.bar>i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
  <button type="button" class="langbtn" id="introBtn"><span aria-hidden="true">ⓘ</span><span id="introBtnTxt"></span></button>
  <div class="langmenu" id="langmenu">
    <button type="button" class="langbtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="langList" aria-label="Language"><span aria-hidden="true">🌐</span><span id="langCur"></span><span class="caret" aria-hidden="true">▾</span></button>
    <div class="langlist" id="langList" role="listbox" aria-label="Language" hidden>
      <button type="button" role="option" data-l="ko">한국어</button>
      <button type="button" role="option" data-l="en">English</button>
      <button type="button" role="option" data-l="zh-Hans">简体中文</button>
      <button type="button" role="option" data-l="zh-Hant">繁體中文</button>
      <button type="button" role="option" data-l="yue">廣東話</button>
      <button type="button" role="option" data-l="id">Bahasa Indonesia</button>
      <button type="button" role="option" data-l="vi">Tiếng Việt</button>
      <button type="button" role="option" data-l="es">Español</button>
      <button type="button" role="option" data-l="fi">Suomi</button>
      <button type="button" role="option" data-l="sv">Svenska</button>
    </div>
  </div>
  </div>

  <header>
    <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="var(--card)" stroke-width="2.2"/><circle cx="16" cy="16" r="3" fill="var(--card)"/></svg><span id="h1"></span></h1>
    <p class="sub" id="sub"></p>
    <p class="notice" id="notice" hidden></p>
  </header>

  <section class="card introcard" id="intro" hidden>
    <h2 id="introTitle"></h2>
    <p id="introBody"></p>
    <p class="stat" id="introAsk"></p>
    <p class="stat" id="introLang"></p>
    <div class="row" style="justify-content:flex-start;margin-top:12px">
      <button class="btn main" id="introGo" type="button"></button>
      <button class="btn" id="introClose" type="button"></button>
    </div>
  </section>

  <section class="card hintcard" id="hint" hidden>
    <p id="hint1"></p>
    <p id="hint2"></p>
    <p id="giftNote" hidden></p>
    <button class="btn main" id="hintOk" type="button"></button>
  </section>

  <section class="card" id="today"></section>

  <section class="card" id="piled">
    <h2 id="piledTitle"></h2>
    <div class="nums">
      <div><b id="nDays">0</b><span id="lbDays"></span></div>
      <div><b id="nWeek">0</b><span id="lbWeek"></span></div>
      <div><b id="nStamps">0</b><span id="lbStamps"></span></div>
    </div>
    <p class="stat" id="pileNote"></p>
    <div id="unlock"></div>
  </section>

  <section class="card">
    <h2 id="weekTitle"></h2>
    <div class="week" id="week"></div>
    <p class="stat" id="stat"></p>
  </section>

  <section class="card">
    <div class="row"><h2 id="editTitle"></h2><button class="btn" id="editBtn" type="button"></button></div>
    <p class="stat" style="margin-top:6px" id="editDesc"></p>
    <div id="edit" hidden>
      <div id="slots"></div>
      <div class="picker" id="picker"></div>
      <p class="msg" id="slotMsg"></p>
      <button class="btn" id="addSlot" type="button"></button>
    </div>
  </section>

  <section class="card" id="bkCard">
    <h2 id="bkTitle"></h2>
    <p class="stat" style="margin-top:6px" id="bkDesc"></p>
    <textarea id="bk"></textarea>
    <div class="row" style="margin-top:10px;justify-content:flex-start">
      <button class="btn main" id="bkOut" type="button"></button>
      <button class="btn" id="bkIn" type="button"></button>
    </div>
    <p class="msg" id="bkMsg" role="status"></p>
  </section>

  <section class="card" id="fbCard">
    <h2 id="fbTitle"></h2>
    <p class="stat" style="margin-top:6px" id="fbDesc"></p>
    <textarea id="fb"></textarea>
    <div class="row" style="margin-top:10px;justify-content:flex-start">
      <button class="btn main" id="copyBtn" type="button"></button>
      <a class="btn" id="formBtn" href="#" target="_blank" rel="noopener" hidden></a>
    </div>
    <p class="msg" id="fbMsg"></p>
    <p class="stat" id="fbHow"></p>
  </section>
</div>

<script>
/* 의견 폼 주소(구글 폼 등). 비워 두면 '폼으로 보내기' 버튼이 안 보이고 복사만 쓸 수 있어요. */
const FEEDBACK_URL='';

   {n} {date} {t} {days} {gift} 는 값이 들어가는 자리. fbHow 는 복사한 글을 누구에게 보낼지 안내도 함께 담는다. */
const L={

  fbPlaceholder:'예: 둘째 날부터 안 열었어요. 이유는…',

const LANGS=['ko','en','zh-Hans','zh-Hant','yue','id','vi','es','fi','sv'];
const LANG_NAMES={ko:'한국어',en:'English','zh-Hans':'简体中文','zh-Hant':'繁體中文',yue:'廣東話',id:'Bahasa Indonesia',vi:'Tiếng Việt',es:'Español',fi:'Suomi',sv:'Svenska'};
const HTML_LANG={ko:'ko',en:'en','zh-Hans':'zh-Hans','zh-Hant':'zh-Hant',yue:'yue-Hant-HK',id:'id',vi:'vi',es:'es',fi:'fi',sv:'sv'};
const LOCALE={ko:'ko-KR',en:'en-US','zh-Hans':'zh-CN','zh-Hant':'zh-TW',yue:'zh-HK',id:'id-ID',vi:'vi-VN',es:'es-ES',fi:'fi-FI',sv:'sv-SE'};
function flat(o,p='',out={}){for(const [k,v] of Object.entries(o)){const key=p?p+'.'+k:k;if(typeof v==='string')out[key]=v;else flat(v,key,out)}return out}
const T={};for(const l of LANGS)T[l]=flat(L[l]);
let lang='ko';
const t=(k,v)=>{let s=T[lang][k]!==undefined?T[lang][k]:T.ko[k];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
function guessLang(){
  const n=(navigator.language||'').toLowerCase();
  if(n.startsWith('yue')||/^zh.*(hk|mo)/.test(n)) return 'yue';
  if(n.startsWith('zh')) return /tw|hant/.test(n)?'zh-Hant':'zh-Hans';
  const base=n.split('-')[0]==='in'?'id':n.split('-')[0];
  return LANGS.includes(base)?base:'en';
}

const COLORS=['#ff8f70','#ffb85c','#5fcfb0','#6cb6f5','#9a8cf2','#ffd666','#4fc3d9'];
const KEY='routine-trial-v1';
const MAX_SLOTS=6;
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let todayStr=fmt(new Date());
const $=id=>document.getElementById(id);

const DEFAULT_SLOTS=[
  {id:'s1',key:'wakeup',icon:'wake',color:COLORS[5]},
  {id:'s2',key:'breakfast',icon:'meal',color:COLORS[1]},
  {id:'s3',key:'move',icon:'walkrun',color:COLORS[2]}];
/* 예전 저장본은 한국어 이름이 그대로 들어 있어서, 기본 이름이면 언어를 따라가는 키로 바꿔 준다 */
const OLD_KO={s1:['일어나기','wakeup'],s2:['아침 먹기','breakfast'],s3:['몸 움직이기','move']};
let S={slots:DEFAULT_SLOTS.map(x=>({...x})),log:{},shelf:[],first:todayStr,hint:true,draft:''};
let store={get(k){return localStorage.getItem(k)},set(k,v){localStorage.setItem(k,v)}};
let persists=true, editOpen=false, pickFor=-1, pendingDel=null, lastPop=null, shelvedMsg=false, bkPending=null;

function load(){
  let fresh=true;
  try{
    const j=store.get(KEY);
    if(j){const o=JSON.parse(j);if(o&&Array.isArray(o.slots)&&o.slots.length&&o.log&&typeof o.log==='object'){S=Object.assign(S,o);fresh=false}}
  }catch(e){}
  if(!Array.isArray(S.shelf)) S.shelf=[];
  S.slots=S.slots.map(s=>{
    if(s.key) return s;
    const d=OLD_KO[s.id];
    if(d&&s.name===d[0]) return {id:s.id,key:d[1],icon:s.icon,color:s.color};
    if(s.name&&s.name===T.ko['icons.'+s.icon]) return {id:s.id,key:s.icon,icon:s.icon,color:s.color};
    return s;
  });
  let migrated=false;
  if(typeof S.opened!=='number'){
    S.opened=Math.min(MAX_SLOTS,Math.max(S.slots.length,legacyCap(stampDays())));
    migrated=true;
  }
  if(fresh){S.gift=true;save()}else if(migrated) save();
}
function save(){try{store.set(KEY,JSON.stringify(S));return true}catch(e){return false}}
function probe(){try{store.set('__p','1');return store.get('__p')==='1'}catch(e){return false}}

const autoLabel=s=>(s.key&&T[lang]['slots.'+s.key])||T[lang]['icons.'+(s.key||s.icon)]||'';
const slotLabel=s=>s.name||autoLabel(s);

const get=(date,id)=>(S.log[date]||{})[id]||0;
const ids=()=>S.slots.concat(S.shelf).map(s=>s.id);
function hasStamp(date){const have=new Set(ids());const d=S.log[date];return !!d&&Object.keys(d).some(k=>have.has(k)&&d[k]>0)}
function realDays(){let n=0;for(const d in S.log)if(hasStamp(d))n++;return n}
function stampDays(){return realDays()+(S.gift?1:0)}
function weekCount(){let n=0;for(let i=0;i<7;i++){const dt=new Date();dt.setDate(dt.getDate()-i);if(hasStamp(fmt(dt)))n++}return n}
function stampCount(){let n=0;const have=new Set(ids());for(const d in S.log)for(const k in S.log[d])if(have.has(k)&&S.log[d][k]>0)n++;return n}
/* 도장 찍은 날(누적)이 이만큼 되면 4·5·6번째 칸이 열린다 */
const UNLOCK=[3,28,60];
/* 예전 일정(3·7·14일). 예전에 이미 열어 둔 칸을 지키는 데만 쓴다 */
const legacyCap=d=>3+(d>=3?1:0)+(d>=7?1:0)+(d>=14?1:0);
function capacity(){
  const d=stampDays();
  const c=Math.min(MAX_SLOTS,3+UNLOCK.filter(x=>d>=x).length);
  /* 한 번 열린 칸은 일정이 바뀌어도 다시 닫지 않는다 */
  if(!(S.opened>=c)){S.opened=c;save()}
  return Math.min(MAX_SLOTS,S.opened);
}
function dayStatus(date){
  const v=S.slots.map(s=>get(date,s.id));
  if(!v.length) return 'none';
  if(v.every(x=>x===1)) return 'perfect';
  if(v.every(x=>x>=1)) return 'mini';
  return 'none';
}
const iconSVG=k=>ICONS[k]?`<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">${ICONS[k]}</svg>`:'⭐';
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
const rot=(date,id)=>((hash(date+id)%15)-7)+'deg';
function stampHTML(s,v,date){
  if(!v) return `<div class="empty">＋</div>`;
  return `<div class="stamp ${v===2?'mini':''}" style="--c:${s.color};--r:${rot(date,s.id)}">${iconSVG(s.icon)}</div>`;
}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toggle(date,id){
  const before=dayStatus(date);
  const day=S.log[date]=Object.assign({},S.log[date]);
  const next=((day[id]||0)+1)%3;
  if(next===0) delete day[id]; else day[id]=next;
  if(!Object.keys(day).length) delete S.log[date];
  save();
  lastPop=date+'|'+id;
  render();
  if(before==='none'&&dayStatus(date)!=='none') confetti();
}

function applyStatic(){
  document.documentElement.lang=HTML_LANG[lang];
  document.title=t('title');
  const set=(id,k)=>{$(id).textContent=t(k)};
  set('h1','h1');set('hint1','hint1');set('hint2','hint2');set('giftNote','hintGift');set('hintOk','hintOk');
  set('piledTitle','piledTitle');set('lbDays','nDays');set('lbWeek','nWeek');set('lbStamps','nStamps');set('weekTitle','weekTitle');
  set('editTitle','editTitle');set('editDesc','editDesc');set('addSlot','addSlot');
  set('introTitle','introTitle');set('introBody','introBody');set('introAsk','introAsk');set('introLang','introLang');set('introGo','introGo');set('introClose','introClose');set('introBtnTxt','introBtn');
  set('fbTitle','fbTitle');set('fbDesc','fbDesc');set('copyBtn','copyBtn');set('formBtn','formBtn');set('fbHow','fbHow');
  $('fb').placeholder=t('fbPlaceholder');
  set('bkTitle','bkTitle');set('bkDesc','bkDesc');set('bkOut','bkOut');
  $('bkIn').textContent=t(bkPending?'bkOk':'bkIn');
  $('bk').placeholder=t('bkPlaceholder');$('bk').setAttribute('aria-label',t('bkTitle'));
  if(!persists) $('notice').textContent=t('storageNotice');
  $('sub').textContent=t(S.slots.length===1?'subOne':'sub',{n:S.slots.length});
  $('langCur').textContent=LANG_NAMES[lang];
  document.querySelectorAll('#langList [data-l]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.l===lang)));
}

function renderToday(){
  const n=S.slots.length;
  const done=S.slots.filter(s=>get(todayStr,s.id)>0).length;
  const st=dayStatus(todayStr);
  const date=new Intl.DateTimeFormat(LOCALE[lang],{month:'long',day:'numeric',weekday:'short'}).format(new Date());
  $('today').innerHTML=`
    <div class="row"><h2>${esc(t('todayTitle',{date}))}</h2><span class="pill">${done} / ${n}</span></div>
    <div class="bar"><i style="width:${n?Math.round(done/n*100):0}%"></i></div>
    <div class="grid">${S.slots.map(s=>{
      const v=get(todayStr,s.id);
      const pop=lastPop===todayStr+'|'+s.id?'pop':'';
      return `<button class="big ${v===1?'done':v===2?'mini':''} ${pop}" data-id="${s.id}" style="--c:${s.color}" type="button">
        <div class="box">${stampHTML(s,v,todayStr)}</div><span class="nm">${esc(slotLabel(s))}</span>
        <span class="st">${esc(v===1?t('stDone'):v===2?t('stMini'):t('stEmpty'))}</span></button>`}).join('')}</div>
    <div class="banner ${st!=='none'?'show':''}">${esc(st==='perfect'?t('bannerPerfect'):t('bannerMini'))}</div>`;
  $('today').querySelectorAll('.big').forEach(b=>b.onclick=()=>toggle(todayStr,b.dataset.id));
}

function renderPiled(){
  const real=realDays(),total=stampDays();
  $('nDays').textContent=real;
  $('nWeek').textContent=weekCount();
  $('nStamps').textContent=stampCount();
  $('pileNote').textContent=t('pileNote');
  const cap=capacity();
  const next=cap<MAX_SLOTS?UNLOCK[cap-3]:0;
  let h='';
  if(S.slots.length<cap) h+=`<p class="unlockhd">${esc(t('unlockOpen'))}</p>`;
  if(next){
    const left=next-total;
    const pct=Math.min(100,Math.round(total/next*100));
    h+=`<p class="unlockhd">${esc(t(left===1?'unlockLeftOne':'unlockLeft',{n:left}))}</p><div class="bar ub" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
    if(S.gift) h+=`<p class="stat">${esc(t('unlockGift'))}</p>`;
  }else if(!h) h=`<p class="unlockhd">${esc(t('unlockAll'))}</p>`;
  $('unlock').innerHTML=h;
}

function renderWeek(){
  const wf=new Intl.DateTimeFormat(LOCALE[lang],{weekday:'short'});
  let h='';
  for(let i=6;i>=0;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);
    const ds=fmt(dt);
    const stt=dayStatus(ds);
    h+=`<div class="day ${i===0?'today':''}"><small>${esc(wf.format(dt))}</small><b>${dt.getDate()}</b><div class="dots">${S.slots.map(s=>{
      const v=get(ds,s.id);
      return `<button class="dot v${v}" style="--c:${s.color}" data-d="${ds}" data-id="${s.id}" aria-label="${esc(slotLabel(s))} ${ds}" type="button"></button>`}).join('')}</div><span class="mark">${stt==='perfect'?'🌈':stt==='mini'?'🌱':''}</span></div>`;
  }
  $('week').innerHTML=h;
  $('week').querySelectorAll('.dot').forEach(b=>b.onclick=()=>toggle(b.dataset.d,b.dataset.id));
  const ym=todayStr.slice(0,7);
  let kept=0;
  for(const d in S.log) if(d.startsWith(ym)&&hasStamp(d)) kept++;
  $('stat').textContent=t('monthStat',{n:kept});
}

function renderEdit(){
  $('edit').hidden=!editOpen;
  $('editBtn').textContent=editOpen?t('close'):t('open');
  if(!editOpen) return;
  $('slots').innerHTML=S.slots.map((s,i)=>`<div class="slot"><button class="iconbtn" style="--c:${s.color}" data-i="${i}" aria-label="${esc(t('picIcon'))}" type="button">${iconSVG(s.icon)}</button><input value="${esc(slotLabel(s))}" maxlength="14" data-i="${i}" aria-label="${esc(t('slotAria'))}"><button class="x" data-del="${i}" type="button">${pendingDel===i?esc(t('delAsk')):'✕'}</button></div>`).join('');
  $('picker').innerHTML=pickFor>=0?Object.keys(ICONS).map(k=>{const nm=esc(T[lang]['icons.'+k]||k);return `<button class="pk ${S.slots[pickFor]&&S.slots[pickFor].icon===k?'on':''}" data-k="${k}" aria-label="${nm}" title="${nm}" type="button"><svg viewBox="0 0 64 64">${ICONS[k]}</svg></button>`}).join(''):'';
  $('slots').querySelectorAll('.iconbtn').forEach(b=>b.onclick=()=>{pickFor=pickFor===+b.dataset.i?-1:+b.dataset.i;renderEdit()});
  $('slots').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
    const s=S.slots[+inp.dataset.i];if(!s) return;
    const v=inp.value.trim();
    if(!v||v===autoLabel(s)) delete s.name; else s.name=v;
    save();render();
  });
  $('slots').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.del;
    if(S.slots.length<=1){$('slotMsg').textContent=t('needOne');return}
    if(pendingDel!==i){pendingDel=i;renderEdit();return}
    /* 칸을 빼도 찍어 둔 도장은 지우지 않고 선반에 둔다 (도장 수와 열린 칸이 줄지 않게) */
    S.shelf.push(S.slots.splice(i,1)[0]);
    shelvedMsg=true;pendingDel=null;pickFor=-1;save();render();
  });
  $('picker').querySelectorAll('.pk').forEach(b=>b.onclick=()=>{
    const s=S.slots[pickFor];
    const followsIcon=!s.name&&s.key&&!(('slots.'+s.key) in T.ko);
    s.icon=b.dataset.k;
    if(followsIcon) s.key=b.dataset.k;
    pickFor=-1;save();render();
  });
  const cap=capacity(),days=stampDays();
  const can=S.slots.length<cap;
  $('addSlot').hidden=!can;
  $('slotMsg').textContent=[shelvedMsg?t('shelved'):'',can?'':(S.slots.length>=MAX_SLOTS?t('maxSix'):t('lockMsg',{t:UNLOCK[cap-3],days:t(days===1?'dayCountOne':'dayCount',{n:days}),gift:S.gift?t('lockGift'):''}))].filter(Boolean).join(' ');
}

function statsLine(){
  return `[auto] first_open=${S.first} | active_days=${realDays()} (gift ${S.gift?1:0} separate) | last7=${weekCount()} | stamps=${stampCount()} | boxes=${S.slots.length} | lang=${lang}`;
}
$('copyBtn').onclick=async()=>{
  const full=($('fb').value.trim()?$('fb').value.trim()+'\n\n':'')+statsLine();
  try{await navigator.clipboard.writeText(full);$('fbMsg').textContent=t('copied')}
  catch(e){$('fb').value=full;$('fb').focus();$('fb').select();$('fbMsg').textContent=t('copyFail')}
};
let draftTimer=null;
$('fb').oninput=()=>{clearTimeout(draftTimer);draftTimer=setTimeout(()=>{S.draft=$('fb').value;save()},500)};

$('hintOk').onclick=()=>{S.hint=false;save();render()};
$('introClose').onclick=()=>{S.introOff=true;save();render()};
const scrollMode=()=>matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
$('introBtn').onclick=()=>{S.introOff=false;save();render();scrollTo({top:0,behavior:scrollMode()})};
$('introGo').onclick=()=>{$('fbCard').scrollIntoView({behavior:scrollMode(),block:'start'});$('fb').focus({preventScroll:true})};
$('editBtn').onclick=()=>{editOpen=!editOpen;pickFor=-1;pendingDel=null;shelvedMsg=false;renderEdit()};
$('addSlot').onclick=()=>{
  if(S.slots.length>=capacity()) return;
  const used=new Set(S.slots.map(s=>s.icon));
  const icon=['read','yoga','strength','code','eng','zh'].find(k=>!used.has(k))||'read';
  S.slots.push({id:'s'+Date.now(),key:icon,icon,color:COLORS[S.slots.length%COLORS.length]});
  shelvedMsg=false;save();render();
};
function setLangMenu(open){$('langList').hidden=!open;$('langBtn').setAttribute('aria-expanded',String(open))}
$('langBtn').onclick=e=>{e.stopPropagation();setLangMenu($('langList').hidden)};
document.querySelectorAll('#langList [data-l]').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;S.lang=lang;save();$('fbMsg').textContent='';bkPending=null;$('bkMsg').textContent='';setLangMenu(false);$('langBtn').focus();render();
});
document.addEventListener('click',e=>{if(!$('langmenu').contains(e.target))setLangMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('langList').hidden){setLangMenu(false);$('langBtn').focus()}});

function render(){
  $('intro').hidden=!!S.introOff;
  $('hint').hidden=!S.hint;
  $('giftNote').hidden=!S.gift;
  if(FEEDBACK_URL){$('formBtn').href=FEEDBACK_URL;$('formBtn').hidden=false}
  applyStatic();
  renderToday();renderPiled();renderWeek();renderEdit();
  lastPop=null;
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const set=['⭐','✨','🍀','🎉','🌈','🍊','🎈'];
  for(let i=0;i<34;i++){
    const s=document.createElement('span');
    s.className='fall';s.textContent=set[Math.floor(Math.random()*set.length)];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.6)+'s';s.style.fontSize=(20+Math.random()*18)+'px';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4800);
  }
}

/* 날짜가 바뀌었는지 확인한다: 밤에 열어 둔 탭을 다음 날 다시 봐도 '오늘'이 맞게 */
function refreshToday(){
  const n=fmt(new Date());
  if(n!==todayStr){todayStr=n;render()}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday()});
addEventListener('focus',refreshToday);
addEventListener('pageshow',refreshToday);
setInterval(refreshToday,60000);

/* 기록 코드: 기록을 한 줄 글자로 바꿔 복사해 두었다가 다른 기기나 새 브라우저에서 다시 가져온다. 계정 없이 쓴다. */
const BK_HEAD='DJP1:';
function bkEncode(){
  const json=JSON.stringify({v:1,slots:S.slots,shelf:S.shelf,log:S.log,first:S.first,gift:!!S.gift,opened:S.opened});
  const bytes=new TextEncoder().encode(json);
  let bin='';
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return BK_HEAD+btoa(bin);
}
/* 붙여 넣은 글은 믿지 않고 모양을 하나하나 확인한다. 통과한 값만 새로 만들어 돌려준다. */
function bkClean(o){
  if(!o||typeof o!=='object'||o.v!==1) return null;
  const okId=x=>typeof x==='string'&&/^s\d{1,16}$/.test(x);
  const okDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);
  const seen=new Set();
  const slot=s=>{
    if(!s||typeof s!=='object'||!okId(s.id)||seen.has(s.id)) return null;
    if(typeof s.icon!=='string'||!Object.prototype.hasOwnProperty.call(ICONS,s.icon)) return null;
    if(typeof s.color!=='string'||!/^#[0-9a-fA-F]{6}$/.test(s.color)) return null;
    const c={id:s.id,icon:s.icon,color:s.color};
    if(typeof s.key==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(s.key)) c.key=s.key;
    if(typeof s.name==='string'&&s.name.trim()) c.name=s.name.trim().slice(0,14);
    seen.add(s.id);
    return c;
  };
  if(!Array.isArray(o.slots)||o.slots.length<1||o.slots.length>MAX_SLOTS) return null;
  const slots=o.slots.map(slot);
  if(slots.includes(null)) return null;
  const shelf=Array.isArray(o.shelf)?o.shelf.slice(0,200).map(slot):[];
  if(shelf.includes(null)) return null;
  if(!o.log||typeof o.log!=='object'||Array.isArray(o.log)) return null;
  const log={};
  let days=0;
  for(const d of Object.keys(o.log)){
    if(!okDate(d)||++days>20000) return null;
    const row=o.log[d];
    if(!row||typeof row!=='object'||Array.isArray(row)) return null;
    const r={};
    for(const id of Object.keys(row)){
      if(!okId(id)||(row[id]!==1&&row[id]!==2)) return null;
      if(seen.has(id)) r[id]=row[id];
    }
    if(Object.keys(r).length) log[d]=r;
  }
  const gift=o.gift===true;
  /* 열린 칸 수가 적힌 코드는 그대로, 없는 옛 코드는 예전 일정으로 이미 열린 칸까지 이어 준다 */
  const op=Number.isInteger(o.opened)&&o.opened>=3&&o.opened<=MAX_SLOTS?o.opened:legacyCap(Object.keys(log).length+(gift?1:0));
  return {slots,shelf,log,first:okDate(o.first)?o.first:todayStr,gift,opened:Math.min(MAX_SLOTS,Math.max(slots.length,op))};
}
function bkDecode(text){
  const s=String(text).replace(/\s+/g,'');
  if(s.length>3000000||!s.startsWith(BK_HEAD)) return null;
  try{
    const bin=atob(s.slice(BK_HEAD.length));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return bkClean(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)));
  }catch(e){return null}
}
$('bk').oninput=()=>{if(bkPending){bkPending=null;$('bkMsg').textContent='';applyStatic()}};
$('bkOut').onclick=async()=>{
  const code=bkEncode();
  $('bk').value=code;bkPending=null;
  try{await navigator.clipboard.writeText(code);$('bkMsg').textContent=t('bkCopied')}
  catch(e){$('bk').focus();$('bk').select();$('bkMsg').textContent=t('bkCopyFail')}
  applyStatic();
};
$('bkIn').onclick=()=>{
  if(bkPending){
    const c=bkPending;bkPending=null;
    S.slots=c.slots;S.shelf=c.shelf;S.log=c.log;S.first=c.first;S.gift=c.gift;S.opened=c.opened;
    pickFor=-1;pendingDel=null;shelvedMsg=false;
    save();render();
    $('bk').value='';$('bkMsg').textContent=t('bkDone');
    return;
  }
  const raw=$('bk').value.trim();
  if(!raw){$('bkMsg').textContent=t('bkEmpty');return}
  const c=bkDecode(raw);
  if(!c){$('bkMsg').textContent=t('bkBad');return}
  bkPending=c;
  const have=new Set(c.slots.concat(c.shelf).map(s=>s.id));
  let n=0;
  for(const d in c.log) if(Object.keys(c.log[d]).some(id=>have.has(id))) n++;
  $('bkMsg').textContent=t('bkAsk',{n:n,m:c.slots.length});
  applyStatic();
};

persists=probe();
if(persists) load();
lang=LANGS.includes(S.lang)?S.lang:guessLang();
if(!persists) $('notice').hidden=false;
$('fb').value=S.draft||'';
render();
</script>
