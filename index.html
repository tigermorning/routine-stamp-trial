<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴 도장">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233fb8a5'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>루틴 도장</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 위쪽 줄(안내·설정) → 오늘 칸(큰 도장) → 이번 주 점 → 쌓인 것 → 내 칸 바꾸기(접힘). 설정 화면(접힌 줄: 언어·색 테마·기록 옮기기·의견 보내기). 폰 한 열 기준 */
:root{
  --bg:#f2f7f5; --card:#ffffff; --ink:#34484a; --soft:#69807f; --line:#dbe7e4;
  --accent:#3fb8a5; --accent-ink:#0b3a33; --sun-bg:#ffe08a; --sun-ink:#6b4f00; --shadow:0 6px 18px rgba(63,140,130,.14);
  --blob1:rgba(63,184,165,.16); --blob2:rgba(255,214,102,.28);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[lang="en"]{--body:"Gowun Dodum",system-ui,"Segoe UI",sans-serif}
:root[lang="zh-Hans"]{--display:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;--body:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
:root[lang="zh-Hant"]{--display:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;--body:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
:root[lang^="yue"]{--display:"PingFang HK","Microsoft JhengHei","Noto Sans HK","Noto Sans TC",sans-serif;--body:"PingFang HK","Microsoft JhengHei","Noto Sans HK","Noto Sans TC",sans-serif}
:root[lang="vi"]{--display:system-ui,"Segoe UI",sans-serif;--body:system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f2b2c; --card:#2a3a3b; --ink:#e6f0ee; --soft:#a3b8b4; --line:#3d5351; --accent:#5fd1be; --accent-ink:#06302a;
    --sun-bg:#8a6d1f; --sun-ink:#fff3c9; --shadow:0 6px 18px rgba(0,0,0,.35); --blob1:rgba(95,209,190,.12); --blob2:rgba(255,214,102,.08); color-scheme:dark;
  }
}
/* 색 테마(칸이 열릴 때 하나씩 열림). 어두운 시스템 설정보다 뒤에 두어 고른 테마가 이긴다. 글자·강조 명암비는 WCAG 계산으로 확인(2026-10-21) */
:root[data-theme="peach"]{--bg:#fbf1ea;--card:#ffffff;--ink:#4a3631;--soft:#7d655d;--line:#efd9cc;--accent:#d06a49;--accent-ink:#2b0e05;--shadow:0 6px 18px rgba(190,110,80,.14);--blob1:rgba(208,106,73,.14);--blob2:rgba(255,214,102,.28);color-scheme:light}
:root[data-theme="lavender"]{--bg:#f3f0fa;--card:#ffffff;--ink:#3a3350;--soft:#6f668c;--line:#dfd8f0;--accent:#8670d2;--accent-ink:#0d0620;--shadow:0 6px 18px rgba(120,100,190,.14);--blob1:rgba(134,112,210,.16);--blob2:rgba(255,214,102,.2);color-scheme:light}
:root[data-theme="sunny"]{--bg:#fff7df;--card:#ffffff;--ink:#4a3f1f;--soft:#75683f;--line:#f0e2b8;--accent:#b98400;--accent-ink:#241a00;--shadow:0 6px 18px rgba(190,150,40,.15);--blob1:rgba(185,132,0,.14);--blob2:rgba(255,150,100,.14);color-scheme:light}
:root[data-theme="dark"]{
  --bg:#1f2b2c; --card:#2a3a3b; --ink:#e6f0ee; --soft:#a3b8b4; --line:#3d5351; --accent:#5fd1be; --accent-ink:#06302a;
  --sun-bg:#8a6d1f; --sun-ink:#fff3c9; --shadow:0 6px 18px rgba(0,0,0,.35); --blob1:rgba(95,209,190,.12); --blob2:rgba(255,214,102,.08); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 10% 8%,var(--blob1) 0 90px,transparent 91px),radial-gradient(circle at 92% 16%,var(--blob2) 0 70px,transparent 71px);background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto}
button{font-family:inherit;color:var(--ink)}
h1{font-family:var(--display);font-weight:400;font-size:27px;margin:6px 0 16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:30px;height:30px;flex:none}
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
:root[lang="zh-Hans"] h1,:root[lang="zh-Hans"] h2,:root[lang="zh-Hans"] .nums b,:root[lang="zh-Hant"] h1,:root[lang="zh-Hant"] h2,:root[lang="zh-Hant"] .nums b,:root[lang^="yue"] h1,:root[lang^="yue"] h2,:root[lang^="yue"] .nums b,:root[lang="vi"] h1,:root[lang="vi"] h2,:root[lang="vi"] .nums b{font-weight:700}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.topbar #setBtn{margin-left:auto} /* 안내 버튼이 숨겨져도 설정 버튼은 오른쪽에 둔다 */
.introcard{border-color:var(--accent)}
.introcard p{margin:8px 0 0}
.langbtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.langbtn[aria-expanded="true"]{border-color:var(--accent)}
.langbtn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sethd{font-weight:700;font-size:17px}
.btn.danger{border-color:#c0392b}
.btn.danger.on{background:#b3261e;border-color:#b3261e;color:#fff}
.setrow{border-top:2px solid var(--line);padding:12px 0 4px;margin-top:10px}
.setrow>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding-bottom:8px}
.setrow>summary::-webkit-details-marker{display:none}
.setrow>summary>:first-child{margin-right:auto}
.setrow>summary::after{content:"▾";color:var(--soft);font-size:13px;transition:transform .15s}
.setrow[open]>summary::after{transform:rotate(180deg)}
.setrow>summary .val{color:var(--soft);font-size:14px}
.setrow>summary h2{font-size:17px;margin:0}
.setrow>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.setrow .pillrow{padding-bottom:8px}
#hpName,#keyIn{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;min-width:0;flex:1 1 160px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.opt:disabled{opacity:.65;cursor:default}
.opt small{font-size:12px;color:var(--soft)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.sw-base{background:linear-gradient(135deg,#f2f7f5 50%,#3fb8a5 50%)}
.sw-peach{background:linear-gradient(135deg,#fbf1ea 50%,#d06a49 50%)}
.sw-lavender{background:linear-gradient(135deg,#f3f0fa 50%,#8670d2 50%)}
.sw-sunny{background:linear-gradient(135deg,#fff7df 50%,#b98400 50%)}
.nextcolor{display:flex;align-items:center;gap:6px;margin:8px 0 0}
.rtn{display:flex;align-items:center;gap:12px;padding:8px 0}
.rtn+.rtn{border-top:1px solid var(--line)}
.rico{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));display:grid;place-items:center;font-size:18px}
.rico .ico{width:68%;height:68%;vertical-align:baseline}
.rnm{flex:1;min-width:0;overflow-wrap:anywhere}
.rdays{color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.goals{margin-top:14px;padding-top:10px;border-top:2px solid var(--line);font-size:13px}
.goals .goalscap{margin:0 0 4px;color:var(--soft);font-size:12px}
.goals .unlockhd{font-size:13px;margin:8px 0 4px}
.goals .pip{width:16px;height:16px}
.goals .meter{height:10px;border-width:2px}
.goals .mile{font-size:12px}
.goals .miles{margin-top:6px;font-size:12px}
.notice{background:var(--sun-bg);color:var(--sun-ink);border-radius:14px;padding:8px 12px;font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:2px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--sun-bg);color:var(--sun-ink);border-radius:999px;padding:3px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--line);border-radius:999px;margin:12px 0 14px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb58a,#ffd666,#9be3c8,#7fc8f0,#b3a9f5);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.big{border:3px dashed var(--line);border-radius:22px;background:transparent;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;min-width:0}
.big:active{transform:scale(.96)}
.big:focus-visible,.btn:focus-visible,.dot:focus-visible,.pk:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big .nm{text-align:center;font-size:16px;overflow-wrap:anywhere}
.big .st{font-size:12px;color:var(--soft);min-height:16px;text-align:center}
.box{width:72px;height:72px;display:grid;place-items:center}
.big.done{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.big.mini{border-style:solid;border-color:var(--c)}
.stamp{display:grid;place-items:center;border-radius:50%;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));width:100%;height:100%;font-size:30px;line-height:1;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 6px var(--c);transform:rotate(var(--r,0deg))}
.stamp.mini{opacity:.5}
.ico{width:1.25em;height:1.25em;vertical-align:-.25em}
.stamp .ico{width:70%;height:70%;vertical-align:baseline}
.empty{width:100%;height:100%;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--line);font-size:26px}
.pop .stamp{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:rotate(var(--r,0deg)) scale(2.4);opacity:0}60%{transform:rotate(var(--r,0deg)) scale(.85);opacity:1}100%{transform:rotate(var(--r,0deg)) scale(1)}}
.banner{display:none;margin-top:14px;text-align:center;padding:12px;border-radius:20px;font-size:17px;text-wrap:balance;background:linear-gradient(120deg,#ffe3d1,#fff1bd,#d6f3e8,#d4e9ff,#e3dcfb);background-size:300% 300%;animation:flow 6s ease infinite;color:#34484a}
.banner.show{display:block}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;min-width:0}
.day.today{background:var(--sun-bg);color:var(--sun-ink)}
.day small{font-size:12px;color:inherit;opacity:.8}
.day b{font-weight:400;font-size:15px}
.dots{display:flex;flex-direction:column;gap:5px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;cursor:pointer}
.dot.v1{background:var(--c)}
.dot.v2{background:color-mix(in srgb,var(--c) 40%,transparent)}
.dot[disabled]{opacity:.3;cursor:default}
.mark{font-size:15px;min-height:20px}
.stat{color:var(--soft);font-size:14px;margin:10px 0 0}
.btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot{display:flex;gap:8px;align-items:center;margin-top:10px}
.iconbtn{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--c);background:var(--card);padding:6px;cursor:pointer}
.iconbtn .ico{width:100%;height:100%;display:block}
.slot input{flex:1 1 auto;min-width:0;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}
.x{border:none;background:var(--line);border-radius:999px;min-width:28px;height:28px;cursor:pointer;font-size:13px;padding:0 8px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;max-height:210px;overflow-y:auto;padding:8px 4px}
.picker:empty{display:none}
.chatlink{margin-top:14px}
#goalCard .goals{margin:0;padding:0;border-top:0;font-size:14px}
#goalCard .goalscap{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--ink)}
.wrap{padding-bottom:76px}
.fab{position:fixed;right:16px;bottom:16px;height:56px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px rgba(0,0,0,.28);font:inherit;font-size:16px;font-weight:700;line-height:1;display:inline-flex;align-items:center;gap:8px;cursor:pointer;z-index:55}
.fab .fi{font-size:24px;line-height:1}
.fab::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid var(--accent);opacity:0;pointer-events:none;animation:fabpulse 2.2s ease-out 4}
.fab.seen::after{display:none}
@keyframes fabpulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
@media (prefers-reduced-motion:reduce){.fab::after{animation:none}}
.linkbtn{font:inherit;border:0;background:none;padding:0;margin-left:6px;color:var(--ink);font-weight:700;text-decoration:underline;cursor:pointer}
.fab[hidden]{display:none}
.fab:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#chatView{position:fixed;right:16px;bottom:16px;width:min(400px,calc(100vw - 32px));max-height:calc(100dvh - 32px);z-index:60;display:flex;flex-direction:column}
#chatView[hidden]{display:none}
#chatView #chat{margin:0;min-height:0;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.28)}
#chatView #chLog{max-height:min(46vh,420px)}
@media (max-width:640px){
  #chatView{left:0;right:0;bottom:0;width:auto;max-height:86dvh}
  #chatView #chat{border-radius:24px 24px 0 0}
}
.chrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chrow input{flex:1 1 180px;min-width:0;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px}
#chShare{margin-top:12px;padding:12px;border:2px dashed var(--line);border-radius:18px}
#chLog{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:55vh;overflow-y:auto;padding:2px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;border:2px solid var(--line);background:var(--card);overflow-wrap:anywhere;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bub.a{align-self:flex-start}
.bub small{display:block;margin-top:6px;font-size:12px;color:var(--soft);white-space:normal}
.bub small a{color:inherit}
.quest{margin-top:8px;padding:10px 12px;border:2px solid var(--accent);border-radius:14px;white-space:normal}
.quest b{display:block;font-size:13px;margin-bottom:4px}
.stepline{margin:12px 0 0;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,var(--card));font-size:14px}
.stepline b{margin-right:6px}
.todobox{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.todobox summary{cursor:pointer;font-weight:700}
.todo{display:flex;gap:8px;align-items:center;margin-top:8px}
.todo button.tk{flex:1 1 auto;text-align:left;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 12px;cursor:pointer;overflow-wrap:anywhere}
.todo button.tk.done{text-decoration:line-through;opacity:.6}
.pk{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:4px;cursor:pointer;min-width:0}
.pk.on{border-color:var(--accent)}
.pk svg{width:100%;height:auto;display:block}
.ico.photo{border-radius:50%;object-fit:cover}
.ico.emo{display:inline-grid;place-items:center;font-style:normal;line-height:1;font-size:.82em;overflow:hidden}
.makerow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.makerow input[type=text]{flex:1 1 140px;min-width:0;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}
.makerow label.btn{display:inline-block;cursor:pointer}
textarea{width:100%;min-height:96px;font:inherit;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:10px 14px;margin-top:10px;resize:vertical}
.msg{font-size:14px;color:var(--soft);margin:8px 0 0;min-height:20px}
.hintcard p{margin:0 0 10px}
:root[lang="ko"] :is(.stat,.unlockhd,.msg,.hintcard p,.introcard p,.introcard h2,.big .st,.sub,.notice){word-break:keep-all}
.unlockhd{margin:14px 0 6px;font-size:15px}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);display:inline-grid;place-items:center;font-size:12px;line-height:1}
.pip.on{background:var(--accent)}
.pip.gift{background:var(--sun-bg);border-color:var(--sun-bg)}
.meter{height:14px;border-radius:7px;border:2px solid var(--accent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.miles{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--soft)}
.mile{padding:1px 10px;border-radius:999px;border:2px solid var(--accent);font-variant-numeric:tabular-nums}
.mile.done{background:var(--accent);color:var(--accent-ink)}
.miles .milescap{flex-basis:100%}
.fall{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:99;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.pop .stamp,.banner{animation:none}.fall{display:none}.bar>i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
  <button type="button" class="langbtn" id="introBtn"><span aria-hidden="true">ⓘ</span><span id="introBtnTxt"></span></button>
  <button type="button" class="langbtn" id="setBtn" aria-expanded="false" aria-controls="settingsView"><span aria-hidden="true">⚙</span><span id="setBtnTxt"></span></button>
  </div>

  <header>
    <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="var(--card)" stroke-width="2.2"/><circle cx="16" cy="16" r="3" fill="var(--card)"/></svg><span id="h1"></span><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="var(--card)" stroke-width="2.2"/><circle cx="16" cy="16" r="3" fill="var(--card)"/></svg></h1>
    <p class="notice" id="notice" hidden></p>

const LANGS=['ko','en','zh-Hans','zh-Hant','yue','id','vi','es','fi','sv'];
const LANG_NAMES={ko:'한국어',en:'English','zh-Hans':'简体中文','zh-Hant':'繁體中文',yue:'廣東話',id:'Bahasa Indonesia',vi:'Tiếng Việt',es:'Español',fi:'Suomi',sv:'Svenska'};
const HTML_LANG={ko:'ko',en:'en','zh-Hans':'zh-Hans','zh-Hant':'zh-Hant',yue:'yue-Hant-HK',id:'id',vi:'vi',es:'es',fi:'fi',sv:'sv'};
const LOCALE={ko:'ko-KR',en:'en-US','zh-Hans':'zh-CN','zh-Hant':'zh-TW',yue:'zh-HK',id:'id-ID',vi:'vi-VN',es:'es-ES',fi:'fi-FI',sv:'sv-SE'};
function flat(o,p='',out={}){for(const [k,v] of Object.entries(o)){const key=p?p+'.'+k:k;if(typeof v==='string')out[key]=v;else flat(v,key,out)}return out}
const T={};for(const l of LANGS)T[l]=flat(L[l]);
let lang='ko';
const t=(k,v)=>{let s=T[lang][k]!==undefined?T[lang][k]:T.ko[k];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
function guessLang(){
  const n=(navigator.language||'').toLowerCase();
  if(n.startsWith('yue')||/^zh.*(hk|mo)/.test(n)) return 'yue';
  if(n.startsWith('zh')) return /tw|hant/.test(n)?'zh-Hant':'zh-Hans';
  const base=n.split('-')[0]==='in'?'id':n.split('-')[0];
  return LANGS.includes(base)?base:'en';
}

const COLORS=['#ff8f70','#ffb85c','#5fcfb0','#6cb6f5','#9a8cf2','#ffd666','#4fc3d9'];
const KEY='routine-trial-v1';
const MAX_SLOTS=6;
const UNLOCKS=[3,28,60]; // 도장 찍은 누적 일수 → 칸이 하나씩 열림(PRD 2026-10-21)
const THEMES=[{id:'base'},{id:'peach',at:UNLOCKS[0]},{id:'lavender',at:UNLOCKS[1]},{id:'sunny',at:UNLOCKS[2]}]; // 칸이 열릴 때 테마도 하나씩 열림
const THEME_BG={base:'#f2f7f5',peach:'#fbf1ea',lavender:'#f3f0fa',sunny:'#fff7df'};
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let todayStr=fmt(new Date());
const $=id=>document.getElementById(id);

const DEFAULT_SLOTS=[
  {id:'s1',key:'wakeup',icon:'wake',color:COLORS[5]},
  {id:'s2',key:'breakfast',icon:'meal',color:COLORS[1]},
  {id:'s3',key:'move',icon:'walkrun',color:COLORS[2]}];
/* 예전 저장본은 한국어 이름이 그대로 들어 있어서, 기본 이름이면 언어를 따라가는 키로 바꿔 준다 */
const OLD_KO={s1:['일어나기','wakeup'],s2:['아침 먹기','breakfast'],s3:['몸 움직이기','move']};
let S={slots:DEFAULT_SLOTS.map(x=>({...x})),log:{},shelf:[],first:todayStr,hint:true,draft:''};
let store={get(k){return localStorage.getItem(k)},set(k,v){localStorage.setItem(k,v)}};
let persists=true, editOpen=false, pickFor=-1, pendingDel=null, lastPop=null, shelvedMsg=false, delPending=false;

function load(){
  let fresh=true;
  try{
    const j=store.get(KEY);
    if(j){const o=JSON.parse(j);if(o&&Array.isArray(o.slots)&&o.slots.length&&o.log&&typeof o.log==='object'){S=Object.assign(S,o);fresh=false}}
  }catch(e){}
  if(!Array.isArray(S.shelf)) S.shelf=[];
  S.slots=S.slots.map(s=>{
    if(s.key) return s;
    const d=OLD_KO[s.id];
    if(d&&s.name===d[0]) return {id:s.id,key:d[1],icon:s.icon,color:s.color};
    if(s.name&&s.name===T.ko['icons.'+s.icon]) return {id:s.id,key:s.icon,icon:s.icon,color:s.color};
    return s;
  });
  if(fresh){S.gift=true;save()}
}
function save(){try{store.set(KEY,JSON.stringify(S));return true}catch(e){return false}}
function probe(){try{store.set('__p','1');return store.get('__p')==='1'}catch(e){return false}}

const autoLabel=s=>(s.key&&T[lang]['slots.'+s.key])||T[lang]['icons.'+(s.key||s.icon)]||'';
const slotLabel=s=>s.name||autoLabel(s);

const get=(date,id)=>(S.log[date]||{})[id]||0;
const ids=()=>S.slots.concat(S.shelf).map(s=>s.id);
function hasStamp(date){const have=new Set(ids());const d=S.log[date];return !!d&&Object.keys(d).some(k=>have.has(k)&&d[k]>0)}
function realDays(){let n=0;for(const d in S.log)if(hasStamp(d))n++;return n}
function stampDays(){return realDays()+(S.gift?1:0)}
function weekCount(){let n=0;for(let i=0;i<7;i++){const dt=new Date();dt.setDate(dt.getDate()-i);if(hasStamp(fmt(dt)))n++}return n}
function stampCount(){let n=0;const have=new Set(ids());for(const d in S.log)for(const k in S.log[d])if(have.has(k)&&S.log[d][k]>0)n++;return n}
function capacity(){const d=stampDays();return Math.min(MAX_SLOTS,3+UNLOCKS.filter(x=>d>=x).length)}
function themeOpen(th){return !th.at||stampDays()>=th.at}
function currentTheme(){ // 설정에서 고른 테마(열려 있을 때). 고르지 않았으면 열린 것 중 가장 나중 테마가 자동 적용
  const th=THEMES.find(x=>x.id===S.theme);if(th&&themeOpen(th))return th.id;
  let id='base';for(const x of THEMES)if(x.at&&themeOpen(x))id=x.id;return id}
function applyTheme(){
  const id=currentTheme();
  const root=document.documentElement;
  if(id==='base') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',id);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',THEME_BG[id]);
}
function dayStatus(date){
  const v=S.slots.map(s=>get(date,s.id));
  if(!v.length) return 'none';
  if(v.every(x=>x===1)) return 'perfect';
  if(v.every(x=>x>=1)) return 'mini';
  return 'none';
}
const iconOf=s=>{
  if(s.img&&String(s.img).startsWith('data:image/')) return `<img class="ico photo" src="${esc(s.img)}" alt="">`;
  if(s.emoji) return `<span class="ico emo" aria-hidden="true">${esc(s.emoji)}</span>`;
  return iconSVG(s.icon);
};
const iconSVG=k=>ICONS[k]?`<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">${ICONS[k]}</svg>`:'⭐';
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
const rot=(date,id)=>((hash(date+id)%15)-7)+'deg';
function stampHTML(s,v,date){
  if(!v) return `<div class="empty">＋</div>`;
  return `<div class="stamp ${v===2?'mini':''}" style="--c:${s.color};--r:${rot(date,s.id)}">${iconOf(s)}</div>`;
}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toggle(date,id){
  const before=dayStatus(date);
  const day=S.log[date]=Object.assign({},S.log[date]);
  const next=((day[id]||0)+1)%3;
  if(next===0) delete day[id]; else day[id]=next;
  if(!Object.keys(day).length) delete S.log[date];
  save();
  lastPop=date+'|'+id;
  render();
  if(before==='none'&&dayStatus(date)!=='none') confetti();
}

function applyStatic(){
  document.documentElement.lang=HTML_LANG[lang];
  document.title=t('title');
  const set=(id,k)=>{$(id).textContent=t(k)};
  set('h1','h1');set('hint1','hint1');set('hint2','hint2');set('hintOk','hintOk');
  set('piledTitle','piledTitle');set('weekTitle','weekTitle');
  set('editTitle','editTitle');set('editDesc','editDesc');set('addSlot','addSlot');
  set('introTitle','introTitle');set('introBody','introBody');set('introLang','introLang');$('introLang').hidden=!t('introLang');set('introGo','introGo');set('introClose','introClose');set('introBtnTxt','introBtn');
  set('fbTitle','fbTitle');set('fbDesc','fbDesc');set('copyBtn','copyBtn');set('formBtn','formBtn');set('fbHow','fbHow');
  $('fb').placeholder=t('fbPlaceholder');
  if(!persists) $('notice').textContent=t('storageNotice');
  set('setBtnTxt','setBtn');set('setTitle','setBtn');set('setBack','setBack');set('langCap','langCap');set('themeCap','themeCap');
  set('privCap','privCap');set('privBody','privBody');set('delCap','delCap');set('delBody','delBody');
}

function renderToday(){
  const n=S.slots.length;
  const done=S.slots.filter(s=>get(todayStr,s.id)>0).length;
  const st=dayStatus(todayStr);
  const date=new Intl.DateTimeFormat(LOCALE[lang],{month:'long',day:'numeric',weekday:'short'}).format(new Date());
  if(S.step&&S.step.d!==todayStr){delete S.step;save()} // 하루가 지나면 말없이 사라진다(쌓이지 않고 지울 일도 없음)
  const stepLine=S.step?`<p class="stepline"><b>${esc(t('stepCap'))}</b>${esc(S.step.t)}</p>`:'';
  $('today').innerHTML=`
    <div class="row"><h2>${esc(t('todayTitle',{date}))}</h2><span class="pill">${done} / ${n}</span></div>
    <div class="bar"><i style="width:${n?Math.round(done/n*100):0}%"></i></div>
    <div class="grid">${S.slots.map(s=>{
      const v=get(todayStr,s.id);
      const pop=lastPop===todayStr+'|'+s.id?'pop':'';
      return `<button class="big ${v===1?'done':v===2?'mini':''} ${pop}" data-id="${s.id}" style="--c:${s.color}" type="button">
        <div class="box">${stampHTML(s,v,todayStr)}</div><span class="nm">${esc(slotLabel(s))}</span>
        <span class="st">${esc(v===1?t('stDone'):v===2?t('stMini'):t('stEmpty'))}</span></button>`}).join('')}</div>
    ${stepLine}
    <div class="banner ${st!=='none'?'show':''}">${esc(st==='perfect'?t('bannerPerfect'):t('bannerMini'))}</div>`;
  $('today').querySelectorAll('.big').forEach(b=>b.onclick=()=>toggle(todayStr,b.dataset.id));
}

function slotDays(id){let n=0;for(const d in S.log)if(S.log[d][id]>0)n++;return n} // 그 칸에 도장을 찍은 누적 날수(연속 아님, 줄어들지 않음). '자리 잡았다' 같은 판정은 하지 않는다
function renderPiled(){
  const total=stampDays();
  $('routines').innerHTML=S.slots.map(sl=>{const n=slotDays(sl.id);return `<div class="rtn" style="--c:${sl.color}"><span class="rico">${iconOf(sl)}</span><span class="rnm">${esc(slotLabel(sl))}</span><span class="rdays">${esc(n?t('routineDay',{n}):t('routineNone'))}</span></div>`}).join('');
  $('pileNote').textContent=t('pileNote');
  const next=UNLOCKS.find(x=>total<x);
  let h=`<p class="goalscap">${esc(t('goalsCap'))}</p>`;
  const hd=h; // 캡션만 있는 상태(아래 '모두 열림' 판단용)
  if(S.slots.length<capacity()) h+=`<p class="unlockhd">${esc(t('unlockOpen'))}</p>`;
  if(next){
    const left=next-total;
    const pips=next<=14
      ?`<div class="pips" aria-hidden="true">${Array.from({length:next},(_,i)=>`<i class="pip ${i<total?'on':''} ${S.gift&&i===0?'gift':''}">${S.gift&&i===0?'🎁':''}</i>`).join('')}</div>`
      :`<div class="meter" aria-hidden="true"><i style="width:${Math.min(100,Math.round(total/next*100))}%"></i></div>`;
    // 초반에는 '쌓인 일수', 다음 칸이 가까워지면(80%~) '남은 일수'를 보여 준다(Koo & Fishbach 2012 초록 기준, 전환 시점은 설계 판단)
    const soon=total===0||total/next>=0.8;
    const msg=soon?t(left===1?'unlockLeftOne':'unlockLeft',{n:left}):t(total===1?'unlockSoFarOne':'unlockSoFar',{n:total});
    const giftTag=S.gift&&next<=14?t('giftTag'):''; // 첫 방문 선물 1일이 포함돼 있음을 '쌓인 일수' 옆에 밝힌다
    h+=`<p class="unlockhd">${esc(msg+giftTag)}</p>${pips}`;
  }else if(h===hd) h+=`<p class="unlockhd">${esc(t('unlockAll'))}</p>`;

const STAMP_URL='/api/stamp', STAMP_TIMEOUT=70000;
const BAD_SVG_TAG=/^(script|foreignobject|image|use|a|style|animate|animatetransform|animatemotion|set|iframe|object|embed)$/i;
function cleanSvg(raw){
  const m=String(raw).match(/<svg[\s\S]*<\/svg>/i);if(!m) return null;
  const doc=new DOMParser().parseFromString(m[0],'image/svg+xml');
  const svg=doc.documentElement;
  if(!svg||svg.localName!=='svg'||doc.querySelector('parsererror')) return null;
  [svg,...svg.querySelectorAll('*')].forEach(el=>{
    if(el!==svg&&BAD_SVG_TAG.test(el.localName)){el.remove();return}
    [...el.attributes].forEach(a=>{const n=a.name.toLowerCase();if(n.startsWith('on')||n.includes('href')||/url\((?!\s*#)/i.test(a.value))el.removeAttribute(a.name)});
  });
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  svg.setAttribute('viewBox','0 0 64 64');svg.removeAttribute('width');svg.removeAttribute('height');
  const out=new XMLSerializer().serializeToString(svg);
  return out.length>16000?null:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(out);
}

  chBusy=true;chLive={text:''};renderChat();
  const body={messages:chatHistory(c),context:{slots:S.slots.map(slotLabel),days:stampDays(),today:S.slots.map(s=>get(todayStr,s.id))},todos:[]};
  const hc=helperChar();if(Object.keys(hc).length) body.character=hc; // 고른 것만 보낸다(안 고르면 서버 기본 동작)
  const ctl=chCtl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),CHAT_TIMEOUT);
  let done=null,end='',note='',mode='',keyErr='';
  const onLine=l=>{
    let e;try{e=JSON.parse(l)}catch(x){return}
    if(e.type==='delta'){chLive.text+=e.text||'';renderChat()}
    else if(e.type==='notice'&&e.key==='noEvidence')note='noEvidence';
    else if(e.type==='mode')mode=e.mode;
    else if(e.type==='done')done=e;
    else if(e.type==='crisis'||e.type==='scope'||e.type==='error'){end=e.type;if(e.key)keyErr=String(e.key)}
  };
  try{
    const res=await fetch(CHAT_URL,{method:'POST',headers:keyHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body),signal:ctl.signal});
    if(!res.ok) throw new Error('http');
    if(res.body&&res.body.getReader){
      const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const r=await rd.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});const parts=buf.split('\n');buf=parts.pop();parts.forEach(onLine)}
      if(buf.trim()) onLine(buf);
    }else (await res.text()).split('\n').forEach(l=>l.trim()&&onLine(l));
  }catch(e){end='error'} // 도우미를 못 부르면(서버 없음·시간 초과·끊김) 안내만 하고 앱은 그대로
  finally{clearTimeout(timer)}
  const live=chLive;chLive=null;chBusy=false;chCtl=null;
  const retry=key=>{ // 이번 말은 지우고 입력창에 되돌려 놓아 다시 보낼 수 있게 한다
    c.msgs.splice(c.msgs.indexOf(um),1);$('chIn').value=text;$('chMsg').textContent=t(key);
  };
  if(end==='crisis'||end==='scope'){um.x=true;c.msgs.push({r:'a',k:end==='crisis'?'chCrisis':'chScope',x:true})}
  else if(end==='error') retry(KEY_ERRS.includes(keyErr)?keyErr:'chBusy');
  else if(!done) retry('chCut');
  else if(!done.ok) retry('chBlock');
  else c.msgs.push({r:'a',c:live.text.trim(),mode:done.mode||mode,cards:done.cards||[],note});
  c.msgs=c.msgs.slice(-CHAT_KEEP);save();renderChat();
  if($('chIn').value) $('chIn').focus({preventScroll:true});
}
function setChat(on){
  inChat=on;chGreet=on?greetPick():''; // 창을 여는 순간 한 번 고르고, 대화 중 화면이 다시 그려져도 바뀌지 않게 둔다
  if(on&&!S.chatSeen){S.chatSeen=true;save()}render();
  if(on){const c=chatData();$('chIn').focus({preventScroll:true})}else $('chatFab').focus({preventScroll:true});
}
$('chatFab').onclick=()=>setChat(true);
$('chStyleBtn').onclick=()=>{setView(true);const r=$('hpRow');r.open=true;r.scrollIntoView({behavior:scrollMode(),block:'start'})};
$('chBack').onclick=()=>setChat(false);
$('chSend').onclick=()=>{const v=$('chIn').value;$('chIn').value='';sendChat(v)};
$('chIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('chSend').onclick()}};

let inSettings=false;
function setView(on){
  inSettings=on;if(on)inChat=false;if(!on){delPending=false}render();scrollTo({top:0});
  $(on?'setBack':'setBtn').focus({preventScroll:true});
}
$('setBtn').onclick=()=>setView(!inSettings);
$('setBack').onclick=()=>setView(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(inChat)setChat(false);else if(inSettings)setView(false)}});
/* 내 기록 지우기: 한 번 누르면 '정말 지울까요?'로 바뀌고, 한 번 더 눌러야 지워진다. 이 기기의 저장 내용을 모두 지우고 처음 상태로 돌아간다. */
function renderDelete(){
  $('delBtn').textContent=t(delPending?'delYes':'delBtn');
  $('delBtn').classList.toggle('on',delPending);
  $('delCancel').textContent=t('delCancel');$('delCancel').hidden=!delPending;
  $('delMsg').textContent=delPending?t('delAsk',{n:realDays(),m:S.slots.length}):'';
}
$('delBtn').onclick=()=>{
  if(!delPending){delPending=true;renderDelete();return}
  try{localStorage.removeItem(KEY)}catch(e){}
  setUserKey('');
  location.reload();
};
$('delCancel').onclick=()=>{delPending=false;renderDelete();$('delBtn').focus({preventScroll:true})};
function renderSettings(){
  renderDelete();
  $('langPills').innerHTML=LANGS.map(l=>`<button type="button" class="opt" role="radio" aria-checked="${l===lang}" data-l="${l}">${esc(LANG_NAMES[l])}</button>`).join('');
  $('langPills').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    lang=b.dataset.l;S.lang=lang;save();$('fbMsg').textContent='';render();
    const sel=$('langPills').querySelector('[aria-checked="true"]');if(sel)sel.focus({preventScroll:true});
  });
  const cur=currentTheme();
  $('langVal').textContent=LANG_NAMES[lang];$('themeVal').textContent=t('theme_'+cur); // 접힌 줄에 현재 값을 보여 준다
  $('themePills').innerHTML=THEMES.map(th=>{
    const open=themeOpen(th),name=esc(t('theme_'+th.id));
    const lock=open?'':`<small>🔒 ${esc(t('themeLocked',{d:t('routineDay',{n:th.at})}))}</small>`; // 잠긴 색은 '언제 열리는지'를 보여 주는 목표
    return `<button type="button" class="opt" role="radio" aria-checked="${open&&cur===th.id}" data-th="${th.id}"${open?'':' disabled'}><i class="sw sw-${th.id}"></i><span>${name} ${lock}</span></button>`}).join('');
  $('themePills').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.disabled) return;
    S.theme=b.dataset.th;save();render();
    const sel=$('themePills').querySelector('[aria-checked="true"]');if(sel)sel.focus({preventScroll:true});
  });
  renderHelperRow();
  renderKeyRow();
}
/* 도우미 말투: 이름·말투·이모지. 고른 것만 이 브라우저에 저장하고 대화 요청에 character 로 보낸다. 서버가 값을 한 번 더 걸러 쓴다 */
const HP_SPEECH=[['casual','hpCasual'],['polite','hpPolite']], HP_EMOJI=[['none','hpNone'],['some','hpSome'],['often','hpOften']];
const HP_DEF={speech:'polite',emoji:'some'}; // 서버 기본(설정 없음)과 같다: 존댓말, 이모지 가끔
function helperChar(){
  const c=chatData(),o=c.char&&typeof c.char==='object'?c.char:{},out={};
  const nm=String(o.name||'').trim().slice(0,20);if(nm) out.name=nm;
  if(o.speech==='casual'||o.speech==='polite') out.speech=o.speech;
  if(['none','some','often'].includes(o.emoji)) out.emoji=o.emoji;
  return out;
}
function setHelperChar(key,v){const c=chatData(),o=helperChar();if(v) o[key]=v;else delete o[key];c.char=o;save();render()}
function renderHelperRow(){
  const o=helperChar();
  const sp=HP_SPEECH.find(x=>x[0]===(o.speech||''));
  $('hpCap').textContent=t('hpCap');$('hpVal').textContent=[o.name,o.speech?t(sp[1]):''].filter(Boolean).join(' · ');
  $('hpNameCap').textContent=t('hpName');$('hpName').placeholder=t('hpNamePh');$('hpName').setAttribute('aria-label',t('hpName'));
  if(document.activeElement!==$('hpName')) $('hpName').value=o.name||'';
  $('hpSpeechCap').textContent=t('hpSpeech');$('hpEmojiCap').textContent=t('hpEmoji');
  const pills=(id,list,key)=>{
    $(id).innerHTML=list.map(([v,kk])=>`<button type="button" class="opt" role="radio" aria-checked="${(o[key]||HP_DEF[key])===v}" data-v="${v}">${esc(t(kk))}</button>`).join('');
    $(id).querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      setHelperChar(key,b.dataset.v===HP_DEF[key]?'':b.dataset.v); // 기본값을 고르면 저장값을 지운다
      const sel=$(id).querySelector('[aria-checked="true"]');if(sel)sel.focus({preventScroll:true});
    });
  };
  pills('hpSpeech',HP_SPEECH,'speech');pills('hpEmoji',HP_EMOJI,'emoji');
}
/* 내 OpenAI 키(선택): 이 브라우저 탭의 sessionStorage 에만 둔다(탭을 닫으면 지워짐). 서버에는 요청마다 X-User-LLM-Key 헤더로만 보내고, 화면에는 끝 네 자리만 보인다 */
const UKEY='routine-user-key', KEY_ERRS=['keyMissing','keyInvalid','keyLimit'];
function getUserKey(){try{return sessionStorage.getItem(UKEY)||''}catch(e){return ''}}
function setUserKey(v){try{if(v)sessionStorage.setItem(UKEY,v);else sessionStorage.removeItem(UKEY);return true}catch(e){return false}}
const validKey=v=>/^[\x21-\x7e]{20,200}$/.test(v);
function keyHeaders(hd){const k=getUserKey();if(k)hd['X-User-LLM-Key']=k;return hd}
function renderKeyRow(){
  const k=getUserKey();
  $('keyCap').textContent=t('keyCap');
  $('keyState').textContent=k?t('keySet',{k:k.slice(-4)}):t('keyNone');
  $('keyVal').textContent=k?'····'+k.slice(-4):'';
  $('keyIn').placeholder=t('keyPh');$('keyIn').setAttribute('aria-label',t('keyCap'));
  $('keySave').textContent=t('keySave');$('keyClear').textContent=t('keyClear');$('keyClear').hidden=!k;
}
$('keySave').onclick=()=>{
  const v=$('keyIn').value.trim();
  if(!validKey(v)||!setUserKey(v)){$('keyMsg').textContent=t('keyBad');return}
  $('keyIn').value='';$('keyMsg').textContent=t('keyDone');renderKeyRow();
};
$('keyClear').onclick=()=>{setUserKey('');$('keyIn').value='';$('keyMsg').textContent='';renderKeyRow()};
$('hpName').onchange=()=>setHelperChar('name',$('hpName').value.trim().slice(0,20));

function render(){
  $('mainView').hidden=inSettings;$('settingsView').hidden=!inSettings;
  $('setBtn').setAttribute('aria-expanded',String(inSettings));
  $('intro').hidden=!!S.introOff;
  $('introBtn').hidden=inSettings||(!S.introOff&&!!S.hint); // 설정 화면이거나 소개·사용법 카드가 모두 열려 있을 땐 숨김
  $('hint').hidden=!S.hint;
  if(FEEDBACK_URL){$('formBtn').href=FEEDBACK_URL;$('formBtn').hidden=false}
  applyStatic();
  applyTheme();
  renderToday();renderPiled();renderWeek();renderEdit();renderChat();renderSettings();
  lastPop=null;
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const set=['⭐','✨','🍀','🎉','🌈','🍊','🎈'];
  for(let i=0;i<34;i++){
    const s=document.createElement('span');
    s.className='fall';s.textContent=set[Math.floor(Math.random()*set.length)];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.6)+'s';s.style.fontSize=(20+Math.random()*18)+'px';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4800);
  }
}

/* 날짜가 바뀌었는지 확인한다: 밤에 열어 둔 탭을 다음 날 다시 봐도 '오늘'이 맞게 */
function refreshToday(){
  const n=fmt(new Date());
  if(n!==todayStr){todayStr=n;render()}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday()});
addEventListener('focus',refreshToday);
addEventListener('pageshow',refreshToday);
setInterval(refreshToday,60000);

persists=probe();
if(persists) load();
lang=LANGS.includes(S.lang)?S.lang:guessLang();
if(!persists) $('notice').hidden=false;
$('fb').value=S.draft||'';
render();
</script>
