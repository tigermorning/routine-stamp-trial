name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGING_SERVICE: routine-stamp-trial-staging
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v7

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 배포할 커밋 번호를 화면 파일에 새기기
        run: |
          sed -i "s/__COMMIT__/${GITHUB_SHA::7}/" index.html
          grep -q "v='${GITHUB_SHA::7}'" index.html

      # 1. staging 브랜치에서만 이미지를 만들고, 이미지 이름과 커밋을 다음 단계로 넘긴다
      - name: 이미지 만들기와 올리기 (staging)
        if: github.ref_name != 'main'
        run: |
          IMAGE="${{ vars.AR_REPO }}/routine-stamp-trial:${{ github.sha }}"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      # 2. main 브랜치에서는 이미지를 만들지 않고, staging 리비전의 다이제스트와 커밋을 찾는다
      - name: staging 이미지 찾기 (production 승격)
        if: github.ref_name == 'main'
        run: |
          REV=$(gcloud run services describe "$STAGING_SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          gcloud run revisions describe "$REV" --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --format json > rev.json
          IMAGE=$(jq -r '.status.imageDigest' rev.json)
          COMMIT=$(jq -r '.spec.containers[0].env[] | select(.name=="COMMIT_SHA") | .value' rev.json)
          case "$IMAGE" in *@sha256:*) ;; *) echo "staging 이미지 다이제스트를 찾지 못했다: $IMAGE"; exit 1;; esac
          [ -n "$COMMIT" ] && [ "$COMMIT" != "null" ] || { echo "staging COMMIT_SHA 를 찾지 못했다"; exit 1; }
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "staging 리비전 $REV 의 이미지를 승격한다"

      # 3. 새 리비전을 트래픽 0%로만 올리고, 이 리비전에만 닿는 green 태그 URL 을 붙인다
      #    (--no-traffic 로 올리면 지금 100%인 리비전이 그대로 100%로 고정된다)
      - name: Cloud Run 배포 (트래픽 0% + green 태그)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          image: ${{ env.IMAGE }}
          env_vars: |
            COMMIT_SHA=${{ env.COMMIT }}
            ENV=${{ vars.ENV }}
          no_traffic: true
          tag: green
          # 스타트업 프로브: /health 가 200 이어야 이 리비전이 Ready 가 된다 (기본값은 포트만 열리면 통과)
          flags: --no-allow-unauthenticated --service-account=${{ vars.RUNTIME_SA }} --startup-probe=httpGet.path=/health,periodSeconds=5,failureThreshold=12,timeoutSeconds=2

      # 4. 전환하기 전에, 지금 사용자가 쓰는(100%) 리비전을 기록한다 = 되돌아갈 곳
      - name: 이전 리비전(지금 100%) 기록
        id: before
        run: |
          INFO=$(gcloud run services describe "${{ vars.SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --format json)
          PREV=$(echo "$INFO" | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName')
          NEW=$(echo "$INFO" | jq -r '[.status.traffic[] | select(.tag=="green")][0].revisionName')
          echo "이전 리비전(지금 100%) $PREV"
          echo "새 리비전(0%, green 태그) $NEW"
          [ -n "$PREV" ] && [ "$PREV" != "null" ] && [ -n "$NEW" ] && [ "$NEW" != "null" ]
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      # 5. 태그 URL 로 스모크 테스트. 서비스가 비공개라 ID 토큰이 필요하다(토큰 값은 가리고 출력하지 않는다)
      - name: 스모크 테스트 (green 태그 URL)
        env:
          NEW_REVISION: ${{ steps.before.outputs.new }}
        run: |
          INFO=$(gcloud run services describe "${{ vars.SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --format json)
          SERVICE_URL=$(echo "$INFO" | jq -r '.status.url')
          TAG_URL=$(echo "$INFO" | jq -r '[.status.traffic[] | select(.tag=="green")][0].url')
          [ -n "$TAG_URL" ] && [ "$TAG_URL" != "null" ]
          echo "태그 URL 을 찾았다"
          TOKEN=$(gcloud auth print-identity-token --impersonate-service-account="${{ vars.DEPLOY_SA }}" --audiences="$SERVICE_URL" --include-email)
          echo "::add-mask::$TOKEN"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$TAG_URL/health" || true)
            body=$(curl -s -H "Authorization: Bearer $TOKEN" "$TAG_URL/version" || true)
            commit=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            revision=$(echo "$body" | jq -r '.revision // empty' 2>/dev/null || true)
            echo "시도 $i: /health=$code, /version commit=${commit:0:7} revision=$revision"
            if [ "$code" = "200" ] && [ "$commit" = "$COMMIT" ] && [ "$revision" = "$NEW_REVISION" ]; then
              echo "스모크 테스트 통과"
              exit 0
            fi
            sleep 5
          done
          echo "스모크 테스트 실패: 전환하지 않고 멈춘다. 사용자는 계속 이전 리비전을 쓴다."
          exit 1

      # 6. 스모크 테스트를 통과했을 때만 트래픽 100%를 green 으로 옮긴다
      - name: 전환 (트래픽 100%를 green 으로)
        run: |
          gcloud run services update-traffic "${{ vars.SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --to-tags green=100

      # 7. 배포가 끝나면 커밋, 리비전, 되돌아갈 곳을 실행 요약에 표로 남긴다
      - name: 배포 기록 남기기 (실행 요약)
        run: |
          REV="${{ steps.before.outputs.new }}"
          DIGEST=$(gcloud run revisions describe "$REV" --project "${{ vars.GCP_PROJECT_ID }}" --region us-central1 --format 'value(status.imageDigest)')
          HASH="${DIGEST##*@sha256:}"
          {
            echo "### 배포 기록"
            echo ""
            echo "| 환경 | 서비스 | 커밋 | 새 리비전(지금 100%) | 되돌아갈 리비전 | 이미지 다이제스트(앞 12자리) |"
            echo "| --- | --- | --- | --- | --- | --- |"
            echo "| ${{ vars.ENV }} | ${{ vars.SERVICE }} | ${COMMIT:0:12} | $REV | ${{ steps.before.outputs.prev }} | ${HASH:0:12} |"
          } >> "$GITHUB_STEP_SUMMARY"
