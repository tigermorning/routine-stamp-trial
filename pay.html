<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>루틴 도장 · 크레딧 결제</title>
<style>
:root{--bg:#eef7f5;--card:#fff;--ink:#23403c;--soft:#5d7a75;--line:#d4e8e3;--accent:#3fb8a5;--bad:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#1f2b2c;--card:#2a3a3b;--ink:#e6f0ee;--soft:#a3b8b4;--line:#3d5351;--accent:#5fd1be;--bad:#fb923c}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:560px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 8px}
.soft{color:var(--soft);font-size:.92rem}
.bad{color:var(--bad)}
.big{font-size:1.15rem;font-weight:700}
button,a.btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#06302a;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
code{background:var(--line);padding:1px 5px;border-radius:6px}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1 id="title">결제</h1>
    <p id="summary" class="big"></p>
    <p id="status" role="status"></p>
  </section>
  <section class="card" id="widgetCard" hidden>
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <p><button id="payBtn" type="button" disabled>결제하기</button></p>
  </section>
  <p><a class="btn" href="/">도장 화면으로 돌아가기</a></p>
  <p class="soft">토스페이먼츠 테스트 환경 결제입니다(실제로 돈이 빠져나가지 않음). 금액과 크레딧 수는 서버의 주문에서 읽어 옵니다.</p>
</main>
<script>
/* 하나의 파일이 세 주소를 맡는다: /pay(결제위젯) · /pay/success(서버에 승인 요청) · /pay/fail(오류 표시).
   이 화면은 크레딧을 직접 늘리지 않는다. 성공 페이지는 주소의 값을 서버(/api/payments/confirm)로 보내기만 하고, 서버가 확인·승인·지급한다. */
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
function clientId(){try{return localStorage.getItem('routine-client-id')||''}catch(e){return ''}}
const H={'Content-Type':'application/json','X-Client-Id':clientId()};
function say(text,bad){const s=$('status');s.textContent=text;s.className=bad?'bad':''}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

async function payPage(){
  const orderId=q.get('orderId')||'';
  const r=await fetch('/api/orders/'+encodeURIComponent(orderId),{headers:H,cache:'no-store'});
  if(!r.ok){say('주문을 찾지 못했어요. 도장 화면에서 다시 골라 주세요.',true);return}
  const o=await r.json();
  $('summary').textContent=o.orderName+' · '+o.amount.toLocaleString('ko-KR')+'원';
  if(o.status!=='pending'){say('이미 처리된 주문이에요(상태: '+o.status+').',true);return}
  const cfg=await (await fetch('/api/config',{cache:'no-store'})).json();
  if(!cfg.tossClientKey){
    say('결제 키가 설정되지 않았어요. 서버의 .env 에 TOSS_CLIENT_KEY 와 TOSS_SECRET_KEY(토스페이먼츠 결제위젯용 테스트 키, test_ 로 시작)를 넣고 서버를 다시 켜 주세요. 주문은 대기 상태로 저장돼 있어요.',true);
    return;
  }
  try{await loadScript('https://js.tosspayments.com/v2/standard')}catch(e){say('토스페이먼츠 결제 스크립트를 불러오지 못했어요.',true);return}
  // 결제위젯 v2: TossPayments(클라이언트 키) → widgets({customerKey}) → setAmount → renderPaymentMethods → renderAgreement → requestPayment
  const tossPayments=TossPayments(cfg.tossClientKey);
  const widgets=tossPayments.widgets({customerKey:TossPayments.ANONYMOUS});
  await widgets.setAmount({currency:'KRW',value:o.amount});
  $('widgetCard').hidden=false;
  await Promise.all([
    widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'}),
    widgets.renderAgreement({selector:'#agreement'})
  ]);
  $('payBtn').disabled=false;
  say('결제 수단을 고르고 결제하기를 눌러 주세요.');
  $('payBtn').onclick=async()=>{
    try{
      await widgets.requestPayment({orderId:o.orderId,orderName:o.orderName,
        successUrl:location.origin+'/pay/success',failUrl:location.origin+'/pay/fail'});
    }catch(e){say('결제를 요청하지 못했어요: '+(e.code||'')+' '+(e.message||''),true)}
  };
}

async function successPage(){
  $('title').textContent='결제 확인 중';
  const body={paymentKey:q.get('paymentKey')||'',orderId:q.get('orderId')||'',amount:q.get('amount')||''};
  say('서버가 주문 금액을 확인하고 결제를 승인하고 있어요…');
  const r=await fetch('/api/payments/confirm',{method:'POST',headers:H,body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(r.ok&&j.ok){
    if(j.kind==='item'){
      $('title').textContent='구매 완료';
      $('summary').textContent=(j.itemName||'상품')+' 구매 완료';
      say(j.already?'이미 처리된 결제예요. 한 번만 적용됐어요.':'결제가 승인되어 상점 상품이 내 것이 됐어요. 도장 화면으로 돌아가면 쓸 수 있어요.');
    }else{
    $('title').textContent='충전 완료';
    $('summary').textContent='크레딧 '+j.credits+'개 충전 · 남은 크레딧 '+j.balance+'개';
    say(j.already?'이미 처리된 결제예요. 크레딧은 한 번만 들어갔어요.':'결제가 승인되어 크레딧이 들어갔어요.');
    }
  }else{
    $('title').textContent='충전하지 못했어요';
    say('결제를 확정하지 못했어요('+(j.code||j.error||r.status)+'). '+(j.message||''),true);
  }
}

async function failPage(){
  $('title').textContent='결제가 완료되지 않았어요';
  const code=q.get('code')||'', msg=q.get('message')||'', orderId=q.get('orderId')||'';
  $('summary').textContent=code;
  say(msg||'결제가 취소되었거나 실패했어요. 크레딧은 바뀌지 않았어요.',true);
  if(orderId) fetch('/api/payments/fail',{method:'POST',headers:H,body:JSON.stringify({orderId,code})}).catch(()=>{});
}

const p=location.pathname.replace(/\/+$/,'');
(p==='/pay/success'?successPage:p==='/pay/fail'?failPage:payPage)().catch(e=>say('오류가 났어요: '+e.message,true));
</script>
</body>
</html>
